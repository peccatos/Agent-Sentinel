[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/ingest",
    "crates/store",
    "crates/claude",
    "crates/transcript",
    "crates/analyzer",
    "crates/sentinel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
agent-sentinel-core = { path = "crates/core" }
agent-sentinel-ingest = { path = "crates/ingest" }
agent-sentinel-store = { path = "crates/store" }
agent-sentinel-claude = { path = "crates/claude" }
agent-sentinel-transcript = { path = "crates/transcript" }
agent-sentinel-analyzer = { path = "crates/analyzer" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
criterion = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
